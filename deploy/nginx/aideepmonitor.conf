location = /aideepmonitor { return 308 /aideepmonitor/$is_args$args; }

location ^~ /aideepmonitor/api/ {
    proxy_pass http://127.0.0.1:18001/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path / /aideepmonitor/;
    client_max_body_size 100m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Serve the running, signed frontend container; never a second static copy.
location ^~ /aideepmonitor/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_redirect off;
    proxy_cache off;
    sub_filter_once on;
    sub_filter '<base href="/">' '<base href="/aideepmonitor/">';
    add_header Cache-Control "no-cache" always;
}
