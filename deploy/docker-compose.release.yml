services:
  mysql:
    image: mysql:8.0
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - client_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  sandbox:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-api:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-sandbox
    restart: unless-stopped
    user: "0:0"
    command: ["python", "/app/sandbox/worker.py"]
    environment:
      SANDBOX_JOBS_DIR: /sandbox/jobs
      SANDBOX_QUEUE_GID: "10001"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "KILL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - client_sandbox_jobs:/sandbox/jobs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/sandbox-ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s

  api:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-api:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-api
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      AUTH_SECRET_KEY: "${AUTH_SECRET_KEY}"
      AUTH_BOOTSTRAP_USERNAME: "${AUTH_BOOTSTRAP_USERNAME:-admin}"
      AUTH_BOOTSTRAP_PASSWORD: "${AUTH_BOOTSTRAP_PASSWORD:-}"
      AUTH_ACCESS_TOKEN_MINUTES: "${AUTH_ACCESS_TOKEN_MINUTES:-15}"
      AUTH_REFRESH_TOKEN_DAYS: "${AUTH_REFRESH_TOKEN_DAYS:-7}"
      AUTH_MAX_FAILED_ATTEMPTS: "${AUTH_MAX_FAILED_ATTEMPTS:-5}"
      AUTH_LOCK_MINUTES: "${AUTH_LOCK_MINUTES:-15}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
      DB_INIT_RETRIES: "30"
      DB_INIT_RETRY_DELAY: "2"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      PYTHONPATH: /app
      APP_VERSION: "${APP_VERSION:-latest}"
      APP_CHANNEL: "${APP_CHANNEL:-stable}"
      GITHUB_OWNER: "${GITHUB_OWNER:-jimmindev}"
      GITHUB_REPOSITORY_NAME: "${GITHUB_REPOSITORY_NAME:-ai-deep-monitor}"
      UPDATE_CHECK_ENABLED: "${UPDATE_CHECK_ENABLED:-true}"
      UPDATE_CHECK_CHANNEL: "${UPDATE_CHECK_CHANNEL:-stable}"
      UPDATE_CHECK_BRANCH: "${UPDATE_CHECK_BRANCH:-preprod}"
      UPDATE_CHECK_USER: "${UPDATE_CHECK_USER:-}"
      UPDATE_CHECK_TOKEN: "${UPDATE_CHECK_TOKEN:-}"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
      OLLAMA_FALLBACK_MODEL: "${OLLAMA_FALLBACK_MODEL:-llama3.2:1b}"
      OLLAMA_TEMPERATURE: "${OLLAMA_TEMPERATURE:-0.2}"
      OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-512}"
      TELEMETRY_RAW_RETENTION_DAYS: "${TELEMETRY_RAW_RETENTION_DAYS:-7}"
      TELEMETRY_ROLLUP_RETENTION_DAYS: "${TELEMETRY_ROLLUP_RETENTION_DAYS:-365}"
      CHATBOT_DATA_DIR: /app/data
      SANDBOX_JOBS_DIR: /sandbox/jobs
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - client_api_data:/app/data
      - client_uploaded_mibs:/app/uploaded_mibs
      - client_generated_backups:/app/generated_backups
      - client_sandbox_jobs:/sandbox/jobs
    group_add:
      - "10001"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-ollama
    restart: unless-stopped
    volumes:
      - client_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-models:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-ollama-models
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:3b}"
      OLLAMA_FALLBACK_MODEL: "${OLLAMA_FALLBACK_MODEL:-llama3.2:1b}"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      for model in "$${OLLAMA_MODEL}" "$${OLLAMA_FALLBACK_MODEL}"; do
        [ -z "$${model}" ] && continue;
        ollama show "$${model}" >/dev/null 2>&1 || ollama pull "$${model}" || exit 1;
      done
    depends_on:
      ollama:
        condition: service_healthy

  frontend:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-frontend:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  client_mysql_data:
  client_api_data:
  client_uploaded_mibs:
  client_generated_backups:
  client_ollama_data:
  client_sandbox_jobs:
