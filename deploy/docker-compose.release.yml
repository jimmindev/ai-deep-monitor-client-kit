services:
  mysql:
    image: mysql:8.0
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - client_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  sandbox:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-api:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-sandbox
    restart: unless-stopped
    user: "0:0"
    command: ["python", "/app/sandbox/worker.py"]
    environment:
      SANDBOX_JOBS_DIR: /sandbox/jobs
      SANDBOX_QUEUE_GID: "10001"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "KILL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - client_sandbox_jobs:/sandbox/jobs
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/sandbox-ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s

  api:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-api:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-api
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      AUTH_SECRET_KEY: "${AUTH_SECRET_KEY}"
      AUTH_BOOTSTRAP_USERNAME: "${AUTH_BOOTSTRAP_USERNAME:-admin}"
      AUTH_BOOTSTRAP_PASSWORD: "${AUTH_BOOTSTRAP_PASSWORD:-}"
      AUTH_ACCESS_TOKEN_MINUTES: "${AUTH_ACCESS_TOKEN_MINUTES:-15}"
      AUTH_REFRESH_TOKEN_DAYS: "${AUTH_REFRESH_TOKEN_DAYS:-7}"
      AUTH_MAX_FAILED_ATTEMPTS: "${AUTH_MAX_FAILED_ATTEMPTS:-5}"
      AUTH_LOCK_MINUTES: "${AUTH_LOCK_MINUTES:-15}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
      DB_INIT_RETRIES: "30"
      DB_INIT_RETRY_DELAY: "2"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      PYTHONPATH: /app
      APP_VERSION: "${APP_VERSION:-latest}"
      APP_CHANNEL: "${APP_CHANNEL:-stable}"
      GITHUB_OWNER: "${GITHUB_OWNER:-jimmindev}"
      GITHUB_REPOSITORY_NAME: "${GITHUB_REPOSITORY_NAME:-ai-deep-monitor}"
      UPDATE_CHECK_ENABLED: "${UPDATE_CHECK_ENABLED:-true}"
      UPDATE_CHECK_CHANNEL: "${UPDATE_CHECK_CHANNEL:-stable}"
      UPDATE_CHECK_BRANCH: "${UPDATE_CHECK_BRANCH:-preprod}"
      UPDATE_CHECK_USER: "${UPDATE_CHECK_USER:-}"
      UPDATE_CHECK_TOKEN: "${UPDATE_CHECK_TOKEN:-}"
      LLAMA_CPP_BASE_URL: "http://llama-cpp:8080"
      LLAMA_CPP_MODEL: "${LLAMA_CPP_MODEL:-Llama-3.2-3B-Instruct-Q4_K_M}"
      LLAMA_CPP_TEMPERATURE: "${LLAMA_CPP_TEMPERATURE:-0.2}"
      LLAMA_CPP_MAX_TOKENS: "${LLAMA_CPP_MAX_TOKENS:-512}"
      LLAMA_CPP_TIMEOUT_SECONDS: "${LLAMA_CPP_TIMEOUT_SECONDS:-300}"
      LLAMA_CPP_ACCELERATOR: "${LLAMA_CPP_ACCELERATOR:-cuda}"
      TELEMETRY_RAW_RETENTION_DAYS: "${TELEMETRY_RAW_RETENTION_DAYS:-7}"
      TELEMETRY_ROLLUP_RETENTION_DAYS: "${TELEMETRY_ROLLUP_RETENTION_DAYS:-365}"
      CHATBOT_DATA_DIR: /app/data
      SANDBOX_JOBS_DIR: /sandbox/jobs
      HOST_TERMINAL_JOBS_DIR: /host-terminal/jobs
      TERMINAL_SESSION_TTL_SECONDS: "${TERMINAL_SESSION_TTL_SECONDS:-300}"
      TERMINAL_POLICY_ADMIN_PASSWORD: "${TERMINAL_POLICY_ADMIN_PASSWORD:-ysitech1234}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - client_api_data:/app/data
      - client_uploaded_mibs:/app/uploaded_mibs
      - client_generated_backups:/app/generated_backups
      - client_sandbox_jobs:/sandbox/jobs
      - ./host_terminal_jobs:/host-terminal/jobs
    group_add:
      - "10001"
      - "${HOST_TERMINAL_QUEUE_GID:-10003}"
    depends_on:
      mysql:
        condition: service_healthy
      llama-cpp:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  collector:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-api:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-collector
    restart: unless-stopped
    command: ["python", "-m", "app.collector"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      PYTHONPATH: /app
      PHYSICAL_COLLECTOR_TICK_SECONDS: "${PHYSICAL_COLLECTOR_TICK_SECONDS:-5}"
      PHYSICAL_COLLECTOR_RETRY_SECONDS: "${PHYSICAL_COLLECTOR_RETRY_SECONDS:-5}"
    depends_on:
      api:
        condition: service_healthy

  llama-cpp:
    image: "${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:8557e3d273aa6010d46f355e826348b691ba3ddffccae8eaf0150596bbc3ec42}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-llama-cpp
    restart: unless-stopped
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_CACHE: "/root/.cache/llama.cpp"
    command:
      - "--hf-repo"
      - "${LLAMA_CPP_HF_REPO:-bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M}"
      - "--alias"
      - "${LLAMA_CPP_MODEL:-Llama-3.2-3B-Instruct-Q4_K_M}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLAMA_CPP_CONTEXT_SIZE:-8192}"
      - "--parallel"
      - "${LLAMA_CPP_PARALLEL:-2}"
      - "--n-gpu-layers"
      - "${LLAMA_CPP_GPU_LAYERS:-99}"
      - "--flash-attn"
      - "on"
      - "--cont-batching"
      - "--metrics"
      - "--jinja"
      - "--n-predict"
      - "${LLAMA_CPP_MAX_TOKENS:-512}"
    volumes:
      - client_llama_cpp_cache:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 8s
      retries: 90
      start_period: 30s

  frontend:
    image: "ghcr.io/${GITHUB_OWNER:-jimmindev}/ai-deep-monitor-frontend:${APP_VERSION:-latest}"
    platform: "${DOCKER_PLATFORM:-linux/amd64}"
    container_name: ai-monitor-client-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  client_mysql_data:
  client_api_data:
  client_uploaded_mibs:
  client_generated_backups:
  client_llama_cpp_cache:
  client_sandbox_jobs:
