name: Publier le Client Kit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-kit-latest
  cancel-in-progress: true

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Tester le kit Linux et Jetson
        shell: bash
        run: |
          chmod +x tests/smoke-linux.sh
          SKIP_COMPOSE_TEST=true tests/smoke-linux.sh

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Tester le kit Windows
        shell: pwsh
        run: ./tests/smoke-windows.ps1

  release:
    needs:
      - validate-linux
      - validate-windows
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire les archives stables
        shell: bash
        run: |
          chmod +x scripts/package-release.sh
          scripts/package-release.sh artifacts
          unzip -Z1 artifacts/ai-deep-monitor-client-kit.zip > /tmp/client-kit-zip.list
          tar -tzf artifacts/ai-deep-monitor-client-kit.tar.gz > /tmp/client-kit-tar.list
          ! grep -Ehq '(^|/)VERSION$|release-notes' \
            /tmp/client-kit-zip.list /tmp/client-kit-tar.list
          ! grep -Ehv '^ai-deep-monitor-client-kit(/|$)' \
            /tmp/client-kit-zip.list /tmp/client-kit-tar.list | grep -q .

      - name: Actualiser la release permanente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "AI Deep Monitor Client Kit" \
              --notes "Installateur permanent Windows, Linux et NVIDIA Jetson. Les fichiers de cette release sont remplaces automatiquement a chaque mise a jour du kit." \
              --latest
          else
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "AI Deep Monitor Client Kit" \
              --notes "Installateur permanent Windows, Linux et NVIDIA Jetson. Les fichiers de cette release sont remplaces automatiquement a chaque mise a jour du kit." \
              --latest
          fi

          gh release upload latest \
            artifacts/ai-deep-monitor-client-kit.zip \
            artifacts/ai-deep-monitor-client-kit.tar.gz \
            artifacts/ai-deep-monitor-client-kit-SHA256.txt \
            --clobber
